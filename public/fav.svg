        <!-- Hoparlör gövdesi -->
        <rect x="0" y="5" width="4" height="10" fill="#FFFFFF" rx="1"/>
        <polygon points="4,5 9,2 9,18 4,15" fill="#FFFFFF"/>
        <!-- Ses dalgaları -->
        <path d="M11,6 Q13,10 11,14" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
        <path d="M13,4 Q17,10 13,16" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
