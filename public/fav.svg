<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <!-- Arka plan -->
<!--    #D32F2F-->
    <rect width="64" height="64" rx="12" fill="#373A71"/>

    <!-- Ortadaki "P" harfi -->
